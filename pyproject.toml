[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=77",
  "versioningit",
]

[project]
name = "dlt-filesystem"
description = "Filesystem and blob storage sources and destinations for dlt, across 13 file formats."
readme = "README.md"
license = "MIT"
maintainers = [
  { name = "Andreas Motl", email = "andreas.motl@panodata.org" },
  { name = "TiM", email = "tim@nuimarkets.com" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Intended Audience :: System Administrators",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: OS Independent",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Unix",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Internet",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Archiving",
  "Topic :: Utilities",
]
dynamic = [ "version" ]
# `dlt` plus what reading and writing files over fsspec costs. Everything a single
# format or transport needs beyond this is imported inside the function that needs
# it, so an install carries the transports and pays for a format only on use.
dependencies = [
  "adlfs",
  "azure-storage-blob",
  "dlt>=1.22,<1.31",
  "dropboxdrivefs",
  "fsspec>=2024.6,<2026.10",
  "fsspec-databricks>=0.1.10",
  "gcsfs",
  "gdrive-fsspec",
  "lakefs-spec<0.16",
  "msgraphfs",
  "ocifs",
  "ossfs",
  "paramiko",
  "polars>=1.34,<3",
  "pyarrow>=18,<27",
  "s3fs>=2024.6",
  "smbprotocol; platform_system=='Linux'",
  "smbprotocol[kerberos]; platform_system!='Linux'",
  "verlib2",
  "webdav4[fsspec]",
]
# BSON dumps. The `bson` module ships with pymongo.
optional-dependencies.bson = [
  "pymongo<5",
]
optional-dependencies.develop = [
  "poethepoet<1",
  "pyproject-fmt<3",
  "ruff==0.16.*",
  "ty==0.0.84",
  "validate-pyproject<1",
]
# The DuckDB CSV reader (`csv_duckdb`), an alternative to the default Polars one.
optional-dependencies.duckdb = [
  "duckdb<1.6",
]
optional-dependencies.full = [
  "dlt-filesystem[bson,duckdb,iterable,spreadsheet,vortex]",
]
# Long-tail file formats (MessagePack via iterabledata; CBOR via cbor2, XML via lxml, YAML via
# PyYAML directly). iterabledata core is light (chardet, tqdm); each format's decoder is pulled
# explicitly here (msgpack, cbor2, lxml, pyyaml). lxml and pyyaml are commonly present
# transitively but are declared so the extra is self-contained. Note: iterabledata's import
# package name is the generic `iterable`, which can shadow a same-named local package.
# See dlt_filesystem/source/format/iterable_codec.py.
optional-dependencies.iterable = [
  "cbor2<7",
  "iterabledata>=1.0.15,<2",
  "lxml<7",
  "msgpack<2",
  "pyyaml<7",
]
# XLSX and ODS. fastexcel (Polars' `calamine` engine) reads both, xlsxwriter writes
# XLSX. Polars' own `excel` extra would also pull openpyxl and xlsx2csv, which no
# reader here selects.
optional-dependencies.spreadsheet = [
  "polars[calamine,xlsxwriter]>=1.34,<3",
]
optional-dependencies.test = [
  "openpyxl",
  "pandas<4",
  "pytest<10",
  "pytest-cov<8",
  "pytest-mock<4",
  "pytest-xdist[psutil]<4",
]
# Vortex columnar files. vortex-data is a ~119 MB install that publishes wheels for Python
# 3.11+ only, so it is opt-in rather than carried by every install of this package.
optional-dependencies.vortex = [
  "vortex-data>=0.86,<1; python_version>='3.11'",
]
urls.Issues = "https://github.com/dlt-contrib/dlt-filesystem/issues"
urls.Repository = "https://github.com/dlt-contrib/dlt-filesystem"

# The package carries no `__init__.py` at any level, so discovery has to be told that
# a directory without one is still a package. Without this, setuptools finds nothing
# and builds an empty wheel that `twine check` reports as PASSED.
[tool.setuptools]
packages.find.where = [ "src" ]
packages.find.namespaces = true
package-dir = { "" = "src" }

[tool.ruff]
line-length = 88
# Both distributions are first-party here. Without the second entry, isort groups
# `dlt_filesystem` with third-party imports and reorders every module that touches it.
src = [ ".", "src" ]
lint.select = [
  # Builtins
  "A",
  # Bugbear
  "B",
  # comprehensions
  "C4",
  # Pycodestyle
  "E",
  "E4",
  "E7",
  "E9",
  # eradicate
  "ERA",
  # Pyflakes
  "F",
  # isort
  "I",
  # pandas-vet
  "PD",
  # return
  "RET",
  # Bandit
  "S",
  # print
  "T20",
  "W",
  # flake8-2020
  "YTT",
]
# lint.ignore = [ "E501" ]
lint.extend-ignore = [
  # Module `xxx` shadows a Python standard-library module
  "A005",
  # raise-without-from-inside-except
  "B904",
  # zip() without an explicit strict= parameter
  "B905",
  # Found commented-out code
  "ERA001",
  # collapsible-else-if
  "PLR5501",
  # Unnecessary variable assignment before `return` statement
  "RET504",
  # Unnecessary `elif` after `return` statement
  "RET505",
  # Unnecessary `elif` after `raise` statement
  "RET506",
  # Unnecessary `else` after `continue` statement
  "RET507",
  # Unnecessary `else` after `break` statement
  "RET508",
  # Probable insecure usage of temporary file or directory
  "S108",
]
lint.per-file-ignores."src/dlt_filesystem/source/*" = [
  # line-too-long
  "E501",
]
lint.per-file-ignores."src/dlt_filesystem/target/{local.py,util.py}" = [
  # line-too-long
  "E501",
]
lint.per-file-ignores."src/dlt_filesystem/testing/{stub.py}" = [
  # line-too-long
  "E501",
]
lint.per-file-ignores."release/util/*" = [
  # `print` found. These are command-line programs whose output is the result.
  "T201",
]
lint.per-file-ignores."src/omniload/api.py" = [
  # line-too-long
  "E501",
]
lint.per-file-ignores."src/omniload/core/router.py" = [
  # line-too-long
  "E501",
]
lint.per-file-ignores."src/omniload/{source,target}/*" = [
  # TODO: Review B008
  #       Do not perform function call in argument defaults;
  #       instead, perform the call within the function,
  #       or read the default from a module-level singleton variable
  "B008",
  # Unnecessary list comprehension (rewrite as a set comprehension)
  "C403",
  # Unnecessary `dict()` call (rewrite as a literal)
  "C408",
  # Unnecessary `list()` call within `sorted()`
  "C414",
  # Unnecessary list comprehension (rewrite using `list()`)
  "C416",
  # Unnecessary `map()` usage (rewrite using a generator expression)
  "C417",
  # line-too-long
  "E501",
]
lint.per-file-ignores."src/omniload/{source,target}/**/{client,helpers}.py" = [
  # `print` found
  "T201",
]
lint.per-file-ignores."tests/saas/*" = [
  # Possible hardcoded password assigned to argument
  "S106",
]
lint.per-file-ignores."tests/{warehouse,util}/*" = [
  # `try`-`except`-`pass` detected, consider logging the exception
  "S110",
  # Audit URL open for permitted schemes. Allowing use of `file:` or custom schemes is often unexpected.
  "S310",
]
lint.per-file-ignores."{tests,packages/*/tests}/*" = [
  # Variable is shadowing a Python builtin
  "A001",
  # Function argument is shadowing a Python builtin
  "A002",
  # Unnecessary list comprehension (rewrite using `list()`)
  "C416",
  # line-too-long
  "E501",
  # Allow use of `assert`.
  "S101",
  # Possible SQL injection vector through string-based query construction
  "S608",
  # `print` found
  "T201",
]

[tool.pytest]
ini_options.minversion = "2.0"
ini_options.testpaths = [
  "src",
  "tests",
]
ini_options.pythonpath = [
  ".",
]
ini_options.addopts = """
  -rfEXsS -p pytester --strict-markers --verbosity=3
  --cov --cov-report=term-missing --cov-report=xml
  --numprocesses auto
  """
ini_options.markers = [
]
ini_options.xfail_strict = true
ini_options.log_format = "%(asctime)-15s [%(name)-36s] %(levelname)-8s: %(message)s"
ini_options.log_level = "DEBUG"
ini_options.log_cli_level = "DEBUG"

[tool.coverage]
run.omit = [ "tests/**" ]

[tool.poe]
tasks.check = [
  "lint",
  "test",
]
# Verify `dlt_filesystem` imports on the dependency set its own project declares.
# Installing it alongside omniload always supplies the consumer's list by accident,
# so nothing else here can see an undeclared import.
tasks.check-standalone-imports = { cmd = "python release/util/standalone_import_probe.py" }
tasks.format = [
  # Format project metadata.
  { cmd = "pyproject-fmt --keep-full-version pyproject.toml" },
  # Format code.
  # Configure Ruff not to auto-fix a few items that are useful in workbench mode.
  # e.g.: unused imports (F401), unused variables (F841), `print` statements (T201), commented-out code (ERA001)
  { cmd = "ruff format" },
  { cmd = "ruff check --fix --ignore=ERA --ignore=F401 --ignore=F841 --ignore=T20 --ignore=ERA001" },
]
tasks.lint = [
  { cmd = "ruff format --check" },
  { cmd = "ruff check" },
  { cmd = "validate-pyproject pyproject.toml" },
  { cmd = "ty check" },
]
tasks.release = [
  { cmd = "python -m build" },
  { cmd = "twine upload --verbose --skip-existing dist/*" },
]
tasks.test = { cmd = "pytest", env = { TESTCONTAINERS_RYUK_DISABLED = "true" } }

[tool.versioningit]
vcs.method = "git-archive"
vcs.default-tag = "v0.0.0"
vcs.describe-subst = "$Format:%(describe:tags,match=v*)$"
