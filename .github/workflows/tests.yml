name: Tests

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch: {}
  workflow_call: {}
  pull_request:
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test:

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.10'
          - '3.14'
          - '3.15'

    runs-on: ubuntu-latest
    steps:

      - name: Acquire sources
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          activate-environment: 'true'
          cache-suffix: ${{ matrix.python-version }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: |
          uv pip install --editable='.[full,develop,test]'

      - name: Set timezone
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "Europe/Berlin"
          timezoneMacos: "Europe/Berlin"
          timezoneWindows: "European Standard Time"

      - name: Run linters and software tests
        run: poe check

      # https://github.com/codecov/codecov-action
      - name: Upload coverage results to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          fail_ci_if_error: true

  # The `test` job installs every extra, which hides a module importing something
  # only an extra supplies. This one imports the package on its base dependencies.
  standalone-imports:

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.10'
          - '3.14'
          - '3.15'

    runs-on: ubuntu-latest
    steps:

      - name: Acquire sources
        uses: actions/checkout@v7

      # No `python-version` and no cache: the probe refuses `UV_PYTHON` and
      # `UV_CACHE_DIR`, and builds its own environment per run anyway.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false

      # setup-uv always sets `UV_PYTHON_INSTALL_DIR`, which only says where uv
      # keeps interpreters. Unset it rather than teach the probe to trust it.
      - name: Import the package on its base dependencies
        run: |
          env -u UV_PYTHON_INSTALL_DIR \
            uv run --script release/util/standalone_import_probe.py \
            --python ${{ matrix.python-version }}
